name: ci
on:
  pull_request:
  push:
    branches: [main, 'demo/**']
  schedule:
    - cron: '0 3 * * *'
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v2
      - name: Start the preinstalled PostgreSQL and set the password
        run: |
          $svc = Get-Service | Where-Object Name -like 'postgresql*' | Select-Object -First 1
          Set-Service $svc.Name -StartupType Manual
          Start-Service $svc.Name
          $bin = (Get-ChildItem 'C:\Program Files\PostgreSQL\*\bin\psql.exe' | Select-Object -First 1).DirectoryName
          $env:PGPASSWORD = 'root'
          & "$bin\psql.exe" -U postgres -d postgres -c "ALTER USER postgres PASSWORD 'postgres'"
      - name: setup
        run: just setup
      - name: lint
        run: |
          just lint 2>&1 | Tee-Object -FilePath lint.log
          if ($LASTEXITCODE) { Get-Content lint.log -Tail 25 | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
      - name: unit tests
        run: |
          just test 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE) { Get-Content test.log -Tail 25 | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
      - name: integration
        run: |
          just integration 2>&1 | Tee-Object -FilePath int.log
          if ($LASTEXITCODE) { Get-Content int.log -Tail 25 | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
      - name: 20-point sweep
        run: |
          just sweep bank_5 2>&1 | Tee-Object -FilePath sweep.log
          if ($LASTEXITCODE) { Get-Content sweep.log -Tail 25 | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: results, path: results/*.json }
