name: ci
on:
  pull_request:
  push:
    branches: [main, 'demo/**']
  schedule:
    - cron: '0 3 * * *'
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v2
      - name: Start the preinstalled PostgreSQL and set the password
        shell: pwsh
        run: |
          $svc = Get-Service | Where-Object Name -like 'postgresql*' | Select-Object -First 1
          Set-Service $svc.Name -StartupType Manual
          Start-Service $svc.Name
          $bin = (Get-ChildItem 'C:\Program Files\PostgreSQL\*\bin\psql.exe' | Select-Object -First 1).DirectoryName
          $env:PGPASSWORD = 'root'
          & "$bin\psql.exe" -U postgres -d postgres -c "ALTER USER postgres PASSWORD 'postgres'"
      - run: just setup
      - run: just lint
      - run: just test
      - run: just integration
      - name: 20-point sweep
        run: just sweep bank_5
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: results, path: results/*.json }
