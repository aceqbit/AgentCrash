name: ci
on:
  pull_request:
jobs:
  check:
    runs-on: windows-latest
    services: {}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v2
      - run: just lint
      - run: just test